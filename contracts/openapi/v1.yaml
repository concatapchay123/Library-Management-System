  "components": {
    "headers": {
      "X-Request-ID": {
        "description": "Server-generated correlation identifier, or a syntactically valid client value.",
        "schema": {
          "type": "string"
        }
      },
      "Idempotency-Key": {
        "description": "Client-supplied idempotency key (up to 128 characters) for safe request replay.",
        "schema": {
          "type": "string",
          "maxLength": 128
        }
      },
      "Idempotency-Replayed": {
        "description": "Header indicating whether the response was replayed from a previously cached idempotent execution.",
        "schema": {
          "type": "string"
        }
      }
    },
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "CsrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      }
    },
    "schemas": {
      "HealthStatus": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "ok"
          }
        },
        "additionalProperties": false
      },
      "ProblemDetails": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "request_id"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string",
            "format": "uri-reference"
          },
          "request_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9._-]{1,128}$"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        },
        "additionalProperties": false
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "organization_slug",
          "email",
          "password"
        ],
        "properties": {
          "organization_slug": {
            "type": "string",
            "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "format": "password"
          }
        },
        "additionalProperties": false
      },
      "LoginAccepted": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "authenticated"
          }
        },
        "additionalProperties": false
      },
      "AccessToken": {
        "type": "object",
        "required": [
          "access_token",
          "token_type",
          "expires_in"
        ],
        "properties": {
          "access_token": {
            "type": "string"
          },
          "token_type": {
            "type": "string",
            "const": "Bearer"
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          }
        },
        "additionalProperties": false
      },
      "Principal": {
        "type": "object",
        "required": [
          "user_id",
          "organization_id",
          "permissions"
        ],
        "properties": {
          "user_id": {
            "type": "string",
            "format": "uuid"
          },
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "uniqueItems": true
          }
        },
        "additionalProperties": false
      },
      "AccessPrincipal": {
        "type": "object",
        "required": [
          "user_id",
          "organization_id",
          "session_id",
          "permissions"
        ],
        "properties": {
          "user_id": {
            "type": "string",
            "format": "uuid"
          },
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "session_id": {
            "type": "string",
            "format": "uuid"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "uniqueItems": true
          }
        },
        "additionalProperties": false
      },
      "PasswordChangeRequest": {
        "type": "object",
        "required": [
          "current_password",
          "new_password"
        ],
        "properties": {
          "current_password": {
            "type": "string",
            "format": "password"
          },
          "new_password": {
            "type": "string",
            "format": "password",
            "minLength": 12
          }
        },
        "additionalProperties": false
      },
      "BookWrite": {
        "type": "object",
        "required": [
          "title",
          "authors"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "isbn": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 32
          },
          "authors": {
            "type": "array",
            "minItems": 1,
            "maxItems": 32,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          "published_year": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "maximum": 9999
          }
        },
        "additionalProperties": false
      },
      "Book": {
        "type": "object",
        "required": [
          "book_id",
          "title",
          "authors"
        ],
        "properties": {
          "book_id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "isbn": {
            "type": [
              "string",
              "null"
            ]
          },
          "authors": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "published_year": {
            "type": [
              "integer",
              "null"
            ]
          }
        },
        "additionalProperties": false
      },
      "BookPage": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Book"
