{
  "openapi": "3.1.0",
  "info": {
    "title": "OpenLibraryOS API",
    "version": "1.0.0",
    "description": "The versioned public API contract. Breaking changes require a new API major version."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "getLiveHealth",
        "summary": "Report whether the process is live.",
        "responses": {
          "200": {
            "description": "The process is live.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/X-Request-ID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "getReadinessHealth",
        "summary": "Report whether required dependencies are ready.",
        "responses": {
          "200": {
            "description": "Dependencies are ready.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/X-Request-ID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          },
          "503": {
            "description": "A required dependency is unavailable.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/X-Request-ID"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "operationId": "login",
        "summary": "Authenticate in the named organization.",
        "requestBody": {
          "required": true,
