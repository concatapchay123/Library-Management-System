        "responses": {
          "200": {
            "$ref": "#/components/responses/AccessToken"
          },
          "401": {
            "$ref": "#/components/responses/AuthenticationFailed"
          }
        }
      }
    },
    "/auth/refresh": {
      "post": {
        "operationId": "refreshAccessToken",
        "summary": "Rotate a refresh session and issue a new access token.",
        "security": [
          {
            "CsrfToken": []
          }
