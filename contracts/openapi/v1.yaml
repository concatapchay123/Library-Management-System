    "/books": {
      "get": {
        "operationId": "listBooks",
        "summary": "List bibliographic titles in the authenticated organization.",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "title",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 512
            }
          },
          {
            "name": "isbn",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 32
            }
