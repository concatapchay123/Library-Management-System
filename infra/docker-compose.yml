services:
  database:
    image: ${DATABASE_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  database-init:
    image: ${DATABASE_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04}
    profiles: ["migration", "test"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S database -U sa -P "$$MSSQL_SA_PASSWORD"
        -Q "IF DB_ID(N'openlibrary') IS NULL CREATE DATABASE [openlibrary]"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  migration:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: ${APP_IMAGE:-openlibrary/backend:1.0.0}
    profiles: ["migration"]
    command: ["python", "scripts/run_migrations.py"]
    environment:
      DATABASE_BOOTSTRAP_URL: ${DATABASE_BOOTSTRAP_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - internal

  production-migration:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: ${APP_IMAGE:-openlibrary/backend:1.0.0}
    profiles: ["production", "production-migration"]
    command: ["python", "scripts/run_migrations.py"]
    environment:
      DATABASE_BOOTSTRAP_URL: ${DATABASE_BOOTSTRAP_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  tests:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: test
    image: ${APP_IMAGE:-openlibrary/backend:1.0.0}-test
    profiles: ["test"]
    command:
      - /bin/sh
      - -c
      - >-
        python scripts/run_migrations.py && python -m pytest
        tests/integration/ops/test_audit_outbox.py
        tests/integration/auth/test_login_persistence.py -q
    environment:
      DATABASE_BOOTSTRAP_URL: ${DATABASE_BOOTSTRAP_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: ${APP_IMAGE:-openlibrary/backend:1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?JWT_SIGNING_KEY_ID is required}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:?JWT_PRIVATE_KEY_PEM is required}
      JWT_PUBLIC_KEYS_JSON: ${JWT_PUBLIC_KEYS_JSON:?JWT_PUBLIC_KEYS_JSON is required}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:?JWT_ACCESS_TOKEN_TTL_SECONDS is required}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:?REFRESH_TOKEN_TTL_SECONDS is required}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://localhost:8000/api/v1/health/live'); raise SystemExit(response.status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: ${APP_IMAGE:-openlibrary/backend:1.0.0}
    command: ["python", "-m", "openlibrary.worker"]
    hostname: worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -b \"$$REDIS_URL\" inspect ping --destination=celery@worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  nginx:
    build:
      context: ..
      dockerfile: infra/Dockerfile.nginx
    image: ${NGINX_IMAGE:-openlibrary/nginx:1.0.0}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  internal:
    internal: true
  edge:

volumes:
  redis-data:
  sqlserver-data:
