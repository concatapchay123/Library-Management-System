[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlibraryos-backend"
version = "0.1.0"
description = "OpenLibraryOS Flask backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "celery[redis]>=5.4,<6.0",
    "Flask>=3.0,<4.0",
    "cryptography>=50.0.1",
    "PyJWT[crypto]>=2.10,<3.0",
    "pyodbc>=5.2,<6.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["src"]
