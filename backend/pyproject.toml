[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlibraryos-backend"
version = "0.1.0"
description = "OpenLibraryOS Flask backend"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["src"]
