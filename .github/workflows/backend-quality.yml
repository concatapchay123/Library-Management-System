name: Backend quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend format, lint, typing and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q

  migration-integration:
    name: SQL Server migration integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the SQL Server ODBC driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg unixodbc-dev
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install --yes msodbcsql18
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - name: Start an ephemeral SQL Server
        shell: bash
        run: |
          password="OL1!$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)a"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name openlibrary-sqlserver --publish 1433:1433 --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..30}; do
            if docker exec --env SQLCMDPASSWORD="$password" openlibrary-sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          docker logs openlibrary-sqlserver
          exit 1
      - name: Run migration integration tests
        shell: bash
        run: |
          export DATABASE_BOOTSTRAP_URL="mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          export DATABASE_MIGRATION_URL="mssql+pyodbc://migrator:${MSSQL_SA_PASSWORD}@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          export DATABASE_RUNTIME_URL="mssql+pyodbc://runtime:${MSSQL_SA_PASSWORD}@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          python -m pytest backend/tests/integration/migrations/test_database_roles.py backend/tests/integration/ops/test_audit_outbox.py backend/tests/integration/auth/test_login_persistence.py -q

  openapi:
    name: OpenAPI validation and compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: openapi-spec-validator contracts/openapi/v1.yaml
      - name: Reject breaking V1 changes
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_BRANCH" --depth=1
          if git cat-file -e "origin/$BASE_BRANCH:contracts/openapi/v1.yaml"; then
            git show "origin/$BASE_BRANCH:contracts/openapi/v1.yaml" > "$RUNNER_TEMP/openapi-v1-baseline.yaml"
            python contracts/openapi/check_compatibility.py "$RUNNER_TEMP/openapi-v1-baseline.yaml" contracts/openapi/v1.yaml
          fi

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .github/ci/compose.env -f infra/docker-compose.yml config --quiet
